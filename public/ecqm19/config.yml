backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "accueil"
        label: "Accueil"
        file: "content/accueil.md"
        media_folder: "public/images/accueil"
        public_folder: "/images/accueil"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Sous-titre", name: "subtitle", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "CTA principal", name: "ctaPrimary", widget: "string", required: false }
          - { label: "Lien CTA principal", name: "ctaPrimaryLink", widget: "string", required: false }
          - { label: "CTA secondaire", name: "ctaSecondary", widget: "string", required: false }
          - { label: "Lien CTA secondaire", name: "ctaSecondaryLink", widget: "string", required: false }
          - { label: "Contenu", name: "body", widget: "markdown" }

      - name: "vision"
        label: "Vision"
        file: "content/vision.md"
        media_folder: "public/images/vision"
        public_folder: "/images/vision"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Sous-titre", name: "subtitle", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Contenu", name: "body", widget: "markdown" }

